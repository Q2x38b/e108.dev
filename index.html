    <title>e108</title>
    <script>
      // Resolve the theme before first paint so the page never flashes
      // light on a dark system.
      (function () {
        try {
          var p = localStorage.getItem('theme-preference');
          var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
